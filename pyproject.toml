[project]
name = "aria-teleop"
version = "0.1.0"
description = "Teleoperate a Trossen WidowX AI arm (MuJoCo first) with Aria Gen 2 on-device hand tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy>=1.13",
  "mujoco>=3.2",
]

[project.optional-dependencies]
aria = ["projectaria-client-sdk"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aria_teleop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
